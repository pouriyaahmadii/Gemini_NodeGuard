name: Check and Publish Subscriptions

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config.json'

permissions:
  contents: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install sing-box
        run: |
          VERSION="v1.10.7"
          DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/${VERSION}/sing-box-${VERSION#v}-linux-amd64.tar.gz"
          echo "Downloading sing-box from $DOWNLOAD_URL"
          wget -q -O sing-box.tar.gz "$DOWNLOAD_URL"
          tar -xzf sing-box.tar.gz
          sudo cp sing-box-*/sing-box /usr/local/bin/sing-box
          cp sing-box-*/sing-box ./sing-box
          sudo chmod +x /usr/local/bin/sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Build checker
        run: go build -v -o gemini-checker ./cmd/checker

      - name: Run checker
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: |
          mkdir -p output
          if [ -n "$SUB_URLS" ]; then
            echo "Using SUB_URLS from secrets"
            ./gemini-checker -sub "$SUB_URLS" -singbox ./sing-box
          else
            echo "SUB_URLS secret not found, using config.json"
            ./gemini-checker -config config.json -singbox ./sing-box
          fi

      - name: Deploy to sub branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: sub
          publish_dir: ./output
          force_orphan: true
