name: Check and Publish Subscriptions

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config.json'

permissions:
  contents: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install sing-box
        run: |
          VERSION="v1.10.7"
          DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/${VERSION}/sing-box-${VERSION#v}-linux-amd64.tar.gz"
          echo "Downloading sing-box from $DOWNLOAD_URL"
          wget -q -O sing-box.tar.gz "$DOWNLOAD_URL"
          tar -xzf sing-box.tar.gz
          sudo cp sing-box-*/sing-box /usr/local/bin/sing-box
          cp sing-box-*/sing-box ./sing-box
          sudo chmod +x /usr/local/bin/sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Install Xray-core
        run: |
          VERSION="1.8.24"
          DOWNLOAD_URL="https://github.com/XTLS/Xray-core/releases/download/v${VERSION}/Xray-linux-64.zip"
          echo "Downloading xray from $DOWNLOAD_URL"
          wget -q -O xray.zip "$DOWNLOAD_URL"
          unzip -q xray.zip xray -d ./
          sudo cp ./xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          chmod +x ./xray
          ./xray version

      - name: Build checker
        run: go build -v -o gemini-checker ./cmd/checker

      - name: Run checker
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: |
          mkdir -p output
          if [ -n "$SUB_URLS" ]; then
            echo "Using SUB_URLS from secrets"
            ./gemini-checker -sub "$SUB_URLS" -singbox ./sing-box -xray ./xray
          else
            echo "SUB_URLS secret not found, using config.json"
            ./gemini-checker -config config.json -singbox ./sing-box -xray ./xray
          fi

      - name: Upload Checked Subscriptions
        uses: actions/upload-artifact@v4
        with:
          name: validated-nodes
          path: |
            output/gemini-sub.txt
            output/general-sub.txt
          retention-days: 1

      - name: Output Direct Subscription Links
        if: always()
        run: |
          echo "### 🚀 Direct Subscription Links" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.GIST_ID }}" ]; then
            echo "- **Gemini Direct Link**: \`[https://gist.githubusercontent.com/$](https://gist.githubusercontent.com/$){{ github.repository_owner }}/${{ secrets.GIST_ID }}/raw/gemini-sub.txt\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Local Artifact**: Download \`validated-nodes\` artifact below for plain-text \`vless://\` links." >> $GITHUB_STEP_SUMMARY
