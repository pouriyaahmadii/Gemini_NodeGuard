name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-go-core:
    name: Build Go Core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            artifact_name: gemini-nodeguard-go-linux-amd64
          - os: linux
            arch: arm64
            artifact_name: gemini-nodeguard-go-linux-arm64
          - os: darwin
            arch: amd64
            artifact_name: gemini-nodeguard-go-darwin-amd64
          - os: darwin
            arch: arm64
            artifact_name: gemini-nodeguard-go-darwin-arm64
          - os: windows
            arch: amd64
            artifact_name: gemini-nodeguard-go-windows-amd64.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Compile Go Core
        run: |
          mkdir -p dist
          cd core-go
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o ../dist/${{ matrix.artifact_name }} ./cmd/checker

      - name: Compress artifacts (Unix)
        if: matrix.os != 'windows'
        run: |
          cd dist
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          rm ${{ matrix.artifact_name }}

      - name: Compress artifacts (Windows)
        if: matrix.os == 'windows'
        run: |
          cd dist
          zip ${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}
          rm ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  build-rust-core:
    name: Build Rust Core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
            artifact_name: gemini-nodeguard-rust-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
            artifact_name: gemini-nodeguard-rust-linux-arm64
          - target: x86_64-apple-darwin
            os: darwin
            arch: x86_64
            artifact_name: gemini-nodeguard-rust-darwin-amd64
          - target: aarch64-apple-darwin
            os: darwin
            arch: aarch64
            artifact_name: gemini-nodeguard-rust-darwin-arm64
          - target: x86_64-pc-windows-gnu
            os: windows
            arch: x86_64
            artifact_name: gemini-nodeguard-rust-windows-amd64.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install cross-compilation dependencies (Linux/macOS)
        if: matrix.os == 'linux' || matrix.os == 'darwin'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install cross-compilation dependencies (Windows)
        if: matrix.os == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Compile Rust Core
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --manifest-path core-rust/Cargo.toml --release --target ${{ matrix.target }}

      - name: Package Rust Artifacts
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp core-rust/target/${{ matrix.target }}/release/gemini-nodeguard-rust.exe dist/${{ matrix.artifact_name }}
            cd dist && zip ${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }} && rm ${{ matrix.artifact_name }}
          else
            cp core-rust/target/${{ matrix.target }}/release/gemini-nodeguard-rust dist/${{ matrix.artifact_name }}
            cd dist && tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }} && rm ${{ matrix.artifact_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  build-gui-windows:
    name: Build Windows GUI
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Fyne dependencies
        run: |
          go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Compile Windows GUI
        run: |
          mkdir -p dist
          cd gui-windows
          fyne package -os windows
          cp gui-windows.exe ../dist/gemini-nodeguard-gui-windows-amd64.exe

      - name: Compress GUI artifact
        run: |
          cd dist
          Compress-Archive -Path gemini-nodeguard-gui-windows-amd64.exe -DestinationPath gemini-nodeguard-gui-windows-amd64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-artifacts-windows-amd64
          path: dist/*.zip

  publish:
    name: Publish Release
    needs: [build-go-core, build-rust-core, build-gui-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
