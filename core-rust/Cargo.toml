[package]
name = "gemini-nodeguard-rust"
version = "0.1.0"
edition = "2021"
authors = ["Gemini NodeGuard Contributors"]
description = "High-performance proxy subscription tester and classifier for Gemini compatibility"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["socks", "rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
base64 = "0.21"
futures = "0.3"
anyhow = "1.0"
regex = "1.10"
log = "0.4"
env_logger = "0.10"
